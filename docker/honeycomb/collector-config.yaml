# OpenTelemetry Collector configuration: receive OTLP from the API,
# batch, and forward to Honeycomb cloud.
#
# Honeycomb routes incoming traces by `service.name` resource attribute.
# The API sets service.name=EmployeeSeriesManagement.Api (see Program.cs),
# so spans land in a dataset/environment of that name in your Honeycomb workspace.
#
# For Honeycomb Classic environments (legacy), uncomment x-honeycomb-dataset
# and set HONEYCOMB_DATASET in .env.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
    send_batch_max_size: 2048

  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25

exporters:
  otlp/honeycomb:
    endpoint: api.honeycomb.io:443
    headers:
      x-honeycomb-team: ${env:HONEYCOMB_API_KEY}

  debug:
    verbosity: normal
    sampling_initial: 5
    sampling_thereafter: 200

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/honeycomb, debug]
  telemetry:
    logs:
      level: info
