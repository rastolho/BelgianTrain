# OpenTelemetry Collector — receives OTLP from the API, batches, and forwards
# to Jaeger (and to the `debug` exporter for stdout verification).
#
# Standalone:
#   docker compose -f docker/otel-collector/docker-compose.yml up -d

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: esm-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (used by API)
      - "4318:4318"   # OTLP HTTP (optional)
      - "13133:13133" # health_check extension
    networks:
      - esm-net

networks:
  esm-net:
    name: esm-net
