# SQL Server 2022 — only the database.
#
# Standalone:
#   docker compose -f docker/db/docker-compose.yml up -d
#
# Included from the root docker-compose.yml when running everything.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: esm-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - mssql-data:/var/opt/mssql
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - esm-net

networks:
  esm-net:
    name: esm-net

volumes:
  mssql-data:
